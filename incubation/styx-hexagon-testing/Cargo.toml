[package]
name = "styx-hexagon-testing"
version = "0.1.0"
edition.workspace = true

[features]
hexagon-tests = ["dep:styx-hexagon-testdata", "dep:test-case"]
disable-hexagon-tests = []

[dependencies]
styx-emulator = { workspace = true }
styx-workspace-hack = { version = "0.1", path = "../../styx/workspace-hack" }

# Both of these are used for the tester, which is only used with `cargo test`
# and when feature hexagon-tests is enabled. Since they are only used under a feature flag
# and are optional as such, they cannot be dev-dependencies, as dev deps cannot be optional.
styx-hexagon-testdata = { path = "../../data/test-binaries/styx-hexagon-testdata", features = [
  "hexagon-tests",
], optional = true }
test-case = { workspace = true, optional = true }

# External
clap = { workspace = true }
log = { workspace = true }
