# Put CI checks for building all C examples here
#
# NOTE: these only run on `main`, not on every MR
name: c-examples-ci
on:
  pull_request:
    # dont run if only docs change
    paths-ignore:
      - "./**.md"
      - "docs/**"
  push:
    branches:
      - main

concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: C examples
    runs-on: self-hosted

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Check runner tooling
      shell: bash
      run: |
        rustc --version
        sccache --version
        just --version
        make --version
        gcc --version

    - name: Build stm32f107-processor
      shell: bash
      run: |
        cd styx/bindings/styx-c-api/examples/stm32f107-processor
        make build
        make clean
        cd ../../../

    - name: clean
      shell: bash
      run: |
        cargo clean
