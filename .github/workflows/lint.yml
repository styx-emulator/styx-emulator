name: lint
# run on PR's or pushes to main
on:
  pull_request:
  push:
    branches:
      - main

env:
  STYX_DOCKER_SUDO_REQUIRED: yes

concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  base-lints:
    name: base lint check
    runs-on: self-hosted

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Check runner tooling
      shell: bash
      run: |
        pre-commit --version
        git --version
    - name: Run base lints
      shell: bash
      run: |
        SKIP=clippy,fmt,cargo-check,license-check,fmt-toml pre-commit run -a

  toml-check:
    name: taplo toml format check
    runs-on: self-hosted
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Check runner tooling
      shell: bash
      run: |
        pre-commit --version
        taplo --version
    - name: taplo toml format check
      shell: bash
      run: |
        pre-commit run -a fmt-toml

  rust-fmt:
    name: rust format
    runs-on: self-hosted
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Check runner tooling
      shell: bash
      run: |
        pre-commit --version
        cargo fmt --version
    - name: rustfmt
      shell: bash
      run: |
        pre-commit run -a fmt

  cargo-clippy:
    name: cargo clippy
    runs-on: self-hosted
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Check runner tooling
      shell: bash
      run: |
        pre-commit --version
        cargo clippy --version
        sccache --version
    - name: cargo clippy
      shell: bash
      run: |
        pre-commit run -a clippy

    - name: clean
      shell: bash
      run: |
        cargo clean


  rust-doc-lint:
    name: lint rust docs
    runs-on: self-hosted
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Check runner tooling
      shell: bash
      run: |
        rustc --version
        sccache --version
        just --version
    - name: Lint RustDocs
      shell: bash
      run: |
        just lint-docs

    - name: clean
      shell: bash
      run: |
        cargo clean


  workspace-hack-lint:
    name: lint workspace hack
    runs-on: self-hosted
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Check runner tooling
      shell: bash
      run: |
        rustc --version
        sccache --version
        cargo hakari --version
    - name: Lint workspace-hack
      shell: bash
      run: |
        cargo xtask hakari --stage update --dry-run

    - name: clean
      shell: bash
      run: |
        cargo clean


  license-check:
    name: license check
    runs-on: self-hosted
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Check runner tooling
      shell: bash
      run: |
        rustc --version
        sccache --version
    - name: License check
      shell: bash
      run: |
        cargo xtask license -c

    - name: clean
      shell: bash
      run: |
        cargo clean

  nogpl-check:
    name: nogpl check
    runs-on: self-hosted
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Check runner tooling
      shell: bash
      run: |
        rustc --version
        cargo deny --version
        just --version
    - name: nogpl check
      shell: bash
      run: |
        just nogpl-check

    - name: clean
      shell: bash
      run: |
        cargo clean
