name: python-examples-ci
on:
  pull_request:
    # dont run if only docs change
    paths-ignore:
      - "./**.md"
      - "docs/**"

  push:
    branches:
      - main

concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build python bindings
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check runner tooling
        run: |
          rustc --version
          sccache --version
          just --version
          uv --version
          ruff --version
          python3 --version

      - name: Enter Virtual Environment
        run: |
          uv venv venv
          . venv/bin/activate

      - name: Lint Examples
        run: |
          . venv/bin/activate
          cd styx/bindings/styx-py-api
          # ruff comes from the runner VM, pinned to 0.15.22 because newer
          # releases add lints that we currently fail. see #213
          just lint-ci

      - name: Test
        run: |
          . venv/bin/activate
          cd styx/bindings/styx-py-api
          uv pip install . pytest keystone-engine
          just test

      - name: Clean
        run: |
          cd styx/bindings
          cargo clean
