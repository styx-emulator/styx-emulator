name: c-bindings-ci
on:
  pull_request:
    # dont run if only docs change
    paths-ignore:
      - "./**.md"
      - "docs/**"
  push:
    branches:
      - main

concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build c bindings
    runs-on: self-hosted

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Check runner tooling
      shell: bash
      run: |
        rustc --version
        sccache --version
        just --version
        uv --version
        clang --version

    - name: Enter Virtual Environment
      shell: bash
      run: |
        uv venv venv
        . venv/bin/activate

    - name: Build
      shell: bash
      run: |
        just c-bindings

    - name: clean
      shell: bash
      run: |
        cd styx/bindings
        cargo clean
