name: unused dependency check
on:
  pull_request:
    # dont run if only docs change
    paths-ignore:
      - "./**.md"
      - "docs/**"

env:
  STYX_DOCKER_SUDO_REQUIRED: yes

concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: unused dependency check
    runs-on: self-hosted

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Check runner tooling
      shell: bash
      run: |
        cargo +nightly --version
        sccache --version
        cargo +nightly udeps --version

    - name: Run cargo-udeps
      shell: bash
      run: |
        cargo +nightly udeps --all --all-targets --exclude styx-workspace-hack
