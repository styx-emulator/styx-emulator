[package]
name = "styx-hexagon-processor"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# Styx dependencies
styx-core = { workspace = true }
styx-peripherals = { path = "../../../peripherals" }
styx-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
styx-hexagon-sys = { path =  "../../../generated/styx-hexagon-sys", optional = true }

# Third party dependencies
serde = { workspace = true }
bitbybit = { workspace = true }
arbitrary-int = { workspace = true }
thiserror = { workspace = true }
bitvec = { workspace = true, optional = true }

[features]
hexagon-clade = ["dep:styx-hexagon-sys", "dep:bitvec"]